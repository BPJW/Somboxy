<body>
<canvas id="bg"></canvas><canvas id="fx"></canvas><div class="aurora"></div><div class="flash" id="flash"></div><div class="big" id="big"></div>
<h1>Somboxy</h1><div class="by">by BP</div><div class="copy">© 2026 BP. All rights reserved.</div>
<div class="pips" id="pips"></div>
<p class="msg" id="msg"></p>
<div id="stage"><div class="rays" id="rays"></div><div id="cube"></div></div>
<div class="bar"><button class="ghost" id="hint">Hint</button><button class="ghost" id="reset">Reset</button><button id="share" hidden>Pass it on</button></div>

<script>
var cube=document.getElementById("cube"),stage=document.getElementById("stage"),msg=document.getElementById("msg");
var rx=-24,ry=-32,step=0,done=false,plates=[];
var NAMES=["front","right","back","left","top"];
// real plates run in order (step 0-4); step -1 = decoy that never opens
var CFG=[
{f:"front",s:0,dx:1,dy:0,w:96,h:54,ox:0,oy:-14,tr:78},
{f:"right",s:1,dx:0,dy:-1,w:60,h:96,ox:0,oy:0,tr:60},
{f:"back",s:2,dx:-1,dy:0,w:96,h:54,ox:0,oy:0,tr:78},
{f:"left",s:3,dx:0,dy:1,w:60,h:96,ox:0,oy:0,tr:60},
{f:"top",s:4,dx:0,dy:-1,w:80,h:80,ox:0,oy:0,tr:62},
{f:"front",s:-1,dx:1,dy:0,w:60,h:34,ox:0,oy:68,tr:50},
{f:"bottom",s:-1,dx:1,dy:0,w:80,h:50,ox:0,oy:0,tr:60},
{f:"left",s:-1,dx:0,dy:-1,w:36,h:50,ox:70,oy:-50,tr:40}
];
function build(){
 cube.innerHTML='<div class="velvet"></div><div class="gold"></div><div class="gem" id="gem"><i></i><i></i><i></i></div>';
 var faces={};["front","back","right","left","top","bottom"].forEach(function(n){var d=document.createElement("div");d.className="face f-"+n;cube.appendChild(d);faces[n]=d});
 plates=CFG.map(function(c){
  var p=document.createElement("div");p.className="plate";p.style.width=c.w+"px";p.style.height=c.h+"px";
  p.style.margin=(-c.h/2+c.oy)+"px 0 0 "+(-c.w/2+c.ox)+"px";
  var m0=document.createElement("span"),m1=document.createElement("span");m0.className=m1.className="mk";
  m0.style.left=(110+c.ox)+"px";m0.style.top=(110+c.oy)+"px";
  m1.style.left=(110+c.ox+c.dx*c.tr)+"px";m1.style.top=(110+c.oy+c.dy*c.tr)+"px";
